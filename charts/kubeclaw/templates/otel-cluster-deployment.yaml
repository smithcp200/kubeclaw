{{- if and .Values.observability.enabled .Values.observability.clusterCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeclaw.clusterCollectorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeclaw.labels" . | nindent 4 }}
    {{- include "kubeclaw.clusterCollectorSelectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeclaw.clusterCollectorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeclaw.clusterCollectorSelectorLabels" . | nindent 8 }}
        {{- include "kubeclaw.datadogPodLabels" (dict "ctx" . "component" "otel-cluster") | nindent 8 }}
      annotations:
        {{- include "kubeclaw.clusterCollectorConfigChecksum" . | nindent 8 }}
    spec:
      # Same placement as the rest of the chart's pods. Without it this
      # Deployment drifts onto whatever untainted node exists, away from the pool
      # the workloads it observes are isolated on. The sibling otel-node
      # DaemonSet deliberately does NOT get this: it has its own
      # observability.nodeCollector.tolerations knob, and a DaemonSet must not
      # carry a nodeSelector or it stops covering nodes.
      {{- include "kubeclaw.podPlacement" . | nindent 6 }}
      serviceAccountName: {{ include "kubeclaw.clusterCollectorName" . }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: otel-collector
          image: {{ .Values.observability.clusterCollector.image.repository }}:{{ .Values.observability.clusterCollector.image.tag }}
          imagePullPolicy: {{ .Values.observability.clusterCollector.image.pullPolicy }}
          args:
            - --config=/etc/otel/otel-config.yaml
          ports:
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.observability.clusterCollector.resources | nindent 12 }}
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: otel-config
          configMap:
            name: {{ include "kubeclaw.clusterCollectorName" . }}
{{- end }}
